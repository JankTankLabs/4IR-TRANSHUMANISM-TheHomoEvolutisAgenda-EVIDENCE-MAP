<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE EVIDENCE — Source Documentation Database</title>
  <script>
    // Function to update the hit counters
    function updateHitCounters() {
      // Total visits
      let totalVisits = localStorage.getItem('totalVisits') || 0;
      totalVisits++;
      localStorage.setItem('totalVisits', totalVisits);

      // Unique visits
      const uniqueVisitKey = 'uniqueVisit';
      let uniqueVisits = localStorage.getItem('uniqueVisits') || 0;
      if (!sessionStorage.getItem(uniqueVisitKey)) {
        uniqueVisits++;
        localStorage.setItem('uniqueVisits', uniqueVisits);
        sessionStorage.setItem(uniqueVisitKey, true);
      }

      // Display the values
      document.getElementById('total-visits-counter').textContent = totalVisits;
      document.getElementById('unique-visits-counter').textContent = uniqueVisits;
    }

    document.addEventListener('DOMContentLoaded', updateHitCounters);
  </script>
  <style>
    .hit-counter {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Rest of your content -->

  <div class="hit-counter">
    <div>Total Visits: <span id="total-visits-counter">0</span></div>
    <div>Unique Visitors: <span id="unique-visits-counter">0</span></div>
  </div>
</body>
</html>
